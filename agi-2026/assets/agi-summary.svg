<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AGIはもう来ているのか？ 能力と社会変化を分けると見え方が変わる</title>
<desc id="desc">2021年から2026年のAGI議論の変遷、能力・導入・社会の3つの時計、Cognitive・Agentic・Economic・Embodied AGIをまとめた図</desc>
<style>
  .jp{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Yu Gothic',Meiryo,sans-serif;fill:#15324d}
  .title{font-size:54px;font-weight:800;letter-spacing:-2px}.sub{font-size:25px;font-weight:700;fill:#1f5d91}.h{font-size:26px;font-weight:800;fill:#fff}.th{font-size:18px;font-weight:800;fill:#174f7d}.cell{font-size:16px}.small{font-size:14px;fill:#506b82}.cardh{font-size:22px;font-weight:800;fill:#155583}.cardt{font-size:16px;fill:#36576f}.foot{font-size:12px;fill:#6a8295}.red{fill:#b92f45;font-weight:800}.white{fill:#fff}.bold{font-weight:800}
</style>
<rect width="1600" height="900" fill="#fff"/>
<rect x="28" y="28" width="8" height="65" rx="4" fill="#2f82c7"/>
<text x="52" y="76" class="jp title">AGIはもう来ているのか？</text>
<text x="680" y="73" class="jp sub">能力と社会変化を分けると見え方が変わる</text>
<rect x="30" y="112" width="1540" height="58" rx="12" fill="#edf6fd" stroke="#c8e1f3"/>
<text x="58" y="149" class="jp" font-size="22" font-weight="800">結論：「AGIかどうか」の判定軸が、AIの能力から社会変化へ移って見えるため、“まだ来ていない”感覚が残る。</text>
<rect x="30" y="192" width="1540" height="54" rx="10" fill="#164f7f"/>
<text x="55" y="227" class="jp h">2021→2026：AGIの論点はどう移ったか</text>
<text x="1190" y="226" class="jp white" font-size="16">AIは加速した。社会は同じ速度では動かない。</text>
<rect x="30" y="255" width="1540" height="40" fill="#eaf4fb" stroke="#cddfec"/>
<line x1="125" y1="255" x2="125" y2="550" stroke="#cddfec"/><line x1="485" y1="255" x2="485" y2="550" stroke="#cddfec"/><line x1="845" y1="255" x2="845" y2="550" stroke="#cddfec"/><line x1="1215" y1="255" x2="1215" y2="550" stroke="#cddfec"/>
<text x="66" y="281" class="jp th">年</text><text x="215" y="281" class="jp th">中心論点</text><text x="598" y="281" class="jp th">期待された社会変化</text><text x="965" y="281" class="jp th">その後に見えた進展</text><text x="1305" y="281" class="jp th">次の不足</text>
<g stroke="#d8e5ef"><line x1="30" y1="335" x2="1570" y2="335"/><line x1="30" y1="378" x2="1570" y2="378"/><line x1="30" y1="421" x2="1570" y2="421"/><line x1="30" y1="464" x2="1570" y2="464"/><line x1="30" y1="507" x2="1570" y2="507"/><line x1="30" y1="550" x2="1570" y2="550"/></g>
<rect x="30" y="295" width="95" height="255" fill="#f6fbfe"/>
<g class="jp cell">
<text x="56" y="322" font-weight="800">2021</text><text x="145" y="322">未知課題への汎化</text><text x="505" y="322">Narrow AIを超える汎用性</text><text x="865" y="322">基盤モデルの流れが加速</text><text x="1240" y="322">generality</text>
<text x="56" y="365" font-weight="800">2022</text><text x="145" y="365">自然言語で幅広く扱う</text><text x="505" y="365">万能アシスタント</text><text x="865" y="365">ChatGPTの急速な普及</text><text x="1240" y="365">reasoning</text>
<text x="56" y="408" font-weight="800">2023</text><text x="145" y="408">数学・コード・専門知の横断</text><text x="505" y="408">知的労働の大変化</text><text x="865" y="408">GPT-4で「初期AGI」議論</text><text x="1240" y="408">reliability</text>
<text x="56" y="451" font-weight="800">2024</text><text x="145" y="451">マルチモーダル＋ツール</text><text x="505" y="451">専門知的業務の広範な代替</text><text x="865" y="451">既存ベンチの飽和</text><text x="1240" y="451">autonomy</text>
<text x="56" y="494" font-weight="800">2025</text><text x="145" y="494">エージェント化</text><text x="505" y="494">AIが仕事を丸ごと遂行</text><text x="865" y="494">自動化ワークフロー拡大</text><text x="1240" y="494">long-horizon</text>
<text x="56" y="537" font-weight="800">2026</text><text x="145" y="537">長時間・高信頼の自律遂行</text><text x="505" y="537">組織再設計／大量失業？</text><text x="865" y="537">普及は広いが影響は不均一</text><text x="1240" y="537">deployment / impact</text>
</g>
<text x="35" y="590" class="jp" font-size="27" font-weight="800">要点は3つ</text>
<g>
<rect x="30" y="607" width="330" height="112" rx="15" fill="#f0f7fd" stroke="#d2e5f3"/><circle cx="72" cy="644" r="23" fill="#226da7"/><text x="66" y="652" class="jp white" font-size="22" font-weight="800">1</text><text x="110" y="648" class="jp cardh">能力の時計</text><text x="55" y="685" class="jp cardt">言語・推論・コード・ツール利用は急速に前進</text>
<rect x="380" y="607" width="330" height="112" rx="15" fill="#f0f7fd" stroke="#d2e5f3"/><circle cx="422" cy="644" r="23" fill="#226da7"/><text x="416" y="652" class="jp white" font-size="22" font-weight="800">2</text><text x="460" y="648" class="jp cardh">導入の時計</text><text x="405" y="685" class="jp cardt">権限・責任・品質保証への組み込みは遅い</text>
<rect x="730" y="607" width="330" height="112" rx="15" fill="#f0f7fd" stroke="#d2e5f3"/><circle cx="772" cy="644" r="23" fill="#226da7"/><text x="766" y="652" class="jp white" font-size="22" font-weight="800">3</text><text x="810" y="648" class="jp cardh">社会の時計</text><text x="755" y="685" class="jp cardt">雇用・組織・制度の変化はさらに遅い</text>
</g>
<rect x="1090" y="607" width="480" height="112" rx="15" fill="#fff3f5" stroke="#edc8cf"/>
<text x="1115" y="642" class="jp" font-size="20" font-weight="800">だから起こる誤解</text>
<text x="1115" y="676" class="jp red" font-size="20">「大量失業がない ＝ AGIではない」とは限らない</text>
<text x="1115" y="704" class="jp small">大量失業は“能力”ではなく、導入と制度を経た“社会現象”</text>
<rect x="30" y="740" width="1030" height="48" rx="24" fill="#edf6fd"/><text x="95" y="771" class="jp" font-size="20" font-weight="800">能力</text><text x="195" y="771" class="jp" font-size="25">→</text><text x="270" y="771" class="jp" font-size="20" font-weight="800">導入</text><text x="370" y="771" class="jp" font-size="25">→</text><text x="445" y="771" class="jp" font-size="20" font-weight="800">経済影響</text><text x="580" y="771" class="jp" font-size="25">→</text><text x="655" y="771" class="jp" font-size="20" font-weight="800">社会変化</text><text x="790" y="771" class="jp small">この間に大きなタイムラグがある</text>
<text x="35" y="824" class="jp" font-size="22" font-weight="800">AGIを4つに分けると整理しやすい</text>
<g class="jp">
<rect x="30" y="840" width="355" height="42" rx="10" fill="#f7fbfe" stroke="#bcd9ee"/><text x="48" y="867" font-size="16"><tspan font-weight="800" fill="#155583">Cognitive</tspan>：幅広い知的課題</text>
<rect x="400" y="840" width="355" height="42" rx="10" fill="#f7fbfe" stroke="#bcd9ee"/><text x="418" y="867" font-size="16"><tspan font-weight="800" fill="#155583">Agentic</tspan>：長時間の自律遂行</text>
<rect x="770" y="840" width="355" height="42" rx="10" fill="#fbf9ff" stroke="#d5cbee"/><text x="788" y="867" font-size="16"><tspan font-weight="800" fill="#6549a6">Economic</tspan>：仕事の大部分を代替</text>
<rect x="1140" y="840" width="430" height="42" rx="10" fill="#f5fbfa" stroke="#b7ded7"/><text x="1158" y="867" font-size="16"><tspan font-weight="800" fill="#247c72">Embodied</tspan>：物理世界で学び動く</text>
</g>
<text x="1180" y="817" class="jp foot">主な参照：OpenAI / DeepMind / Bubeck et al. / METR / Stanford AI Index / ILO</text>
</svg>